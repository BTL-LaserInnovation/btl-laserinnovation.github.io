name: Publish BlueOcean website

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueocean-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
          name: blueocean-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy BlueOcean
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: blueocean-pages-${{ github.run_id }}-${{ github.run_attempt }}
